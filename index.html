<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#ffbc4b" />
  <title>Tiny Snack Street 小吃街老板</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Tiny Snack Street</p>
        <h1>小吃街老板</h1>
      </div>
      <div class="coin-pill" aria-live="polite"><span>🪙</span><strong id="coins">0</strong></div>
    </header>

    <section id="offlinePanel" class="offline-panel hidden">
      <div>
        <strong>离线收益已到账</strong>
        <p id="offlineText">助手帮你赚了 0 金币</p>
      </div>
      <button id="claimOfflineBtn" class="mini-btn">收下</button>
    </section>

    <section class="street-card">
      <div class="street-sky">
        <span class="cloud c1">☁️</span><span class="cloud c2">☁️</span>
        <div class="signboard">今日主打：<span id="featuredItem">芝士饭团</span></div>
      </div>

      <div class="queue-row" id="queue" aria-label="顾客队列"></div>

      <div class="stall-wrap">
        <div class="stall">
          <div class="awning"><span></span><span></span><span></span><span></span></div>
          <div class="counter">
            <div class="chef">👩‍🍳</div>
            <div class="workbench">
              <div id="currentDish" class="dish-display">🍙</div>
              <div class="progress-shell"><div id="cookProgress" class="progress-fill"></div></div>
              <p id="orderHint">点击“开始制作”服务第 1 位顾客</p>
            </div>
          </div>
        </div>
        <div class="income-pop-layer" id="popLayer"></div>
      </div>
    </section>

    <section class="control-card">
      <div class="order-box">
        <div>
          <span class="label">当前订单</span>
          <h2 id="orderName">等待顾客...</h2>
        </div>
        <div class="price-tag">+<span id="orderReward">0</span></div>
      </div>

      <div class="primary-actions">
        <button id="cookBtn" class="big-btn">开始制作</button>
        <button id="serveBtn" class="big-btn secondary" disabled>收银</button>
      </div>

      <div class="ad-actions">
        <button id="doubleBtn" class="ad-btn">📺 双倍下一单</button>
        <button id="rushBtn" class="ad-btn">⚡ 快速制作</button>
      </div>
    </section>

    <section class="upgrade-card">
      <div class="section-title">
        <h2>升级摊位</h2>
        <button id="resetBtn" class="text-btn">重置</button>
      </div>
      <div id="upgrades" class="upgrade-list"></div>
    </section>

    <section class="tip-card">
      <strong>今日目标</strong>
      <p id="questText">完成 3 单后解锁柠檬气泡水，雇佣助手会自动接单赚钱。</p>
    </section>

    <section class="task-card" id="taskCard">
      <div class="section-title">
        <h2>日常任务</h2>
        <span id="signInBadge" class="badge">✅ 已签到</span>
      </div>
      <div id="taskList" class="task-list"></div>
    </section>

    <section class="social-card" id="socialCard">
      <div class="section-title">
        <h2>排行榜&分享</h2>
      </div>
      <div class="social-actions">
        <button id="shareBtn" class="social-btn">📤 分享战绩</button>
        <button id="rankBtn" class="social-btn">🏆 排行榜</button>
        <button id="inviteBtn" class="social-btn">👥 邀请好友</button>
      </div>
      <div class="rank-preview" id="rankPreview">
        <p>今日榜首：<strong>小吃街大佬 123 单，金币 88000+</strong></p>
      </div>
    </section>
  </main>

  <div id="modalOverlay" class="modal-overlay hidden"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <div id="adModal" class="modal hidden">
    <div class="modal-content">
      <h3>📺 看广告得奖励</h3>
      <p id="adRewardText">观看30秒广告即可获得奖励</p>
      <div class="ad-progress"><span id="adProgressShell"><div class="ad-progress-fill"></div></div>
      <div class="modal-actions">
        <button id="adWatchBtn" class="primary-btn">观看广告</button>
        <button id="adCancelBtn" class="secondary-btn">取消</button>
      </div>
    </div>
  </div>

  <div id="shareModal" class="modal hidden">
    <div class="modal-content">
      <h3>📤 分享得奖励</h3>
      <p>分享到群/好友即可获得</p>
      <div class="reward-box">+ 500 金币 + 双倍收益1小时</div>
      <div class="modal-actions">
        <button id="shareConfirmBtn" class="primary-btn">分享到微信</button>
        <button id="shareCancelBtn" class="secondary-btn">取消</button>
      </div>
    </div>
  </div>

  <div id="signInModal" class="modal hidden">
    <div class="modal-content">
      <h3>✅ 连续登录奖励</h3>
      <div class="sign-in-grid" id="signInGrid"></div>
      <div class="modal-actions">
        <button id="signInClaimBtn" class="primary-btn">领取今日奖励</button>
        <button id="signInCancelBtn" class="secondary-btn">关闭</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
